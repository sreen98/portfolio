<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a09" />
    <title>Sreenath P | Frontend Engineer (React, TypeScript)</title>
    <meta
      name="description"
      content="Sreenath P is a frontend engineer in Kerala, India with 5+ years in React and TypeScript, building multi-tenant SaaS and AI hiring products. Open to work."
    />
    <meta name="author" content="Sreenath P" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Link previews (LinkedIn, WhatsApp, X). VITE_SITE_URL lives in .env. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Sreenath P" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Sreenath P | Frontend Engineer" />
    <meta
      property="og:description"
      content="Sreenath P is a frontend engineer in Kerala, India with 5+ years in React and TypeScript, building multi-tenant SaaS and AI hiring products. Open to work."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sreenath P, Software Engineer, Frontend. React and TypeScript." />
    <meta property="profile:first_name" content="Sreenath" />
    <meta property="profile:last_name" content="P" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sreenath P | Frontend Engineer" />
    <meta
      name="twitter:description"
      content="Sreenath P is a frontend engineer in Kerala, India with 5+ years in React and TypeScript, building multi-tenant SaaS and AI hiring products. Open to work."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Sreenath P, Software Engineer, Frontend. React and TypeScript." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking first paint; the text is pre-rendered. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    /></noscript>
    <!-- Without JavaScript, show the pre-rendered content that would otherwise fade in. -->
    <noscript>
      <style>
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
